<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->

	<form action="#" method="POST">
		<label for="name">Name*</label>
		<input  type="text" id="name" required />
		<br />
		
		<label for="email">Email*</label>
		<input  type="email" id="email" required />
		<br />
		
		<label for="gender">Gender*</label>
		<input  type="radio" id="male" required name="gender"  value="male"/>
		<label for="male" >Male</label>
		<input  type="radio" id="female"  name="gender"  value="female"/>
		<label for="female" >Female</label>
		<br />

		<label for="laptop" >Laptop Brands</label>
		<select name="laptop" id="laptop"  >
			<option value="apple" >Apple</option>
			<option value="asus" >Asus</option>
			<option value="hp" >HP</option>
		</select>

		<br />
       <label for="age">Age*</label>
		<input  type="number" id="age" required />
		<br />
		<label for="dob">Date of Birth*</label>
		<input  type="date" id="dob" required />
		<br />

		<label for="password">Password*</label>
		<input  type="password" id="password" required />
		<br />
		
		<label  required for="portfolio">Portfolio URL*</label>
		<input  type="url" id="portfolio" required />
		<br />

		
		<input  type="submit" id="submit" value="Submit" />
		
		
		
		
		
		
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
